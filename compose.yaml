# Both services use the Dockerfile written by the participant.
# MongoDB is external; provide its read-only URI at runtime.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-explanation:local
    command: ["python", "-m", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-bank_milestone}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-explanation:local
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"
    environment:
      BANK_API_URL: http://api:8000
      DEMO_PERSONAS_PATH: demo_personas.json
    depends_on:
      api:
        condition: service_healthy
